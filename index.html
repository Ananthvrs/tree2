<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>தென்னை மரம் ஏறி வெட்டும் துல்லியமான கவுண்டர்</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --accent: #4caf50;
            --bg-color: #f0f7f4;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            color: var(--primary-dark);
            margin-top: 0;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .worker-selection {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fafafa;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .sensor-status {
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ffe0b2;
        }

        .sensor-status.active {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .counter-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
        }

        .counter-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .stat-val {
            font-size: 15px;
            font-weight: bold;
            color: var(--primary-dark);
        }

        .total-trees-box {
            background: #e8f5e9;
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .total-trees-title {
            font-size: 14px;
            color: var(--primary-dark);
            font-weight: bold;
        }

        .total-trees-val {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary-dark);
            margin-top: 5px;
            line-height: 1;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-start {
            background-color: var(--primary);
            color: white;
        }

        .btn-reset {
            background-color: #616161;
            color: white;
        }

        .log-box {
            background: #f1f8f5;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            color: #2e7d32;
            min-height: 40px;
            max-height: 90px;
            overflow-y: auto;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>தென்னை மரம் ஏறி வெட்டும் துல்லியமான கவுண்டர்</h2>

    <!-- Worker Dropdown with Scroll Down -->
    <div class="worker-selection">
        <label for="workerSelect">தொழிலாளி பெயர் தேர்ந்தெடுக்கவும்:</label>
        <select id="workerSelect" size="1">
            <option value="" disabled selected>-- பெயரைத் தேர்ந்தெடுக்கவும் --</option>
            <option value="C.KARTHICK">C.KARTHICK</option>
            <option value="PUTHU.RAMASAMY">PUTHU.RAMASAMY</option>
            <option value="MADHAVAN">MADHAVAN</option>
            <option value="VEERAIYAN">VEERAIYAN</option>
            <option value="MARIMUTHU">MARIMUTHU</option>
            <option value="KALIDHASH">KALIDHASH</option>
            <option value="PULI">PULI</option>
            <option value="VIGNESH">VIGNESH</option>
            <option value="VEERAPANDI">VEERAPANDI</option>
            <option value="APPU">APPU</option>
            <option value="TAMIL">TAMIL</option>
            <option value="POWER">POWER</option>
            <option value="PRASANTH">PRASANTH</option>
            <option value="MURUGESH">MURUGESH</option>
            <option value="DINESH">DINESH</option>
            <option value="T.PANDI">T.PANDI</option>
            <option value="PANDI">PANDI</option>
            <option value="VIJAY">VIJAY</option>
            <option value="S.R.RAJA">S.R.RAJA</option>
            <option value="RAJASEKAR">RAJASEKAR</option>
            <option value="BALA">BALA</option>
            <option value="SHANGAR">SHANGAR</option>
            <option value="GURU">GURU</option>
            <option value="NEELAKANDAN">NEELAKANDAN</option>
            <option value="SUPPAIYYA">SUPPAIYYA</option>
            <option value="MURUGAN">MURUGAN</option>
            <option value="SAKTHIVEL">SAKTHIVEL</option>
            <option value="RAMESH">RAMESH</option>
            <option value="SELVAM">SELVAM</option>
            <option value="V.SEKAR">V.SEKAR</option>
            <option value="SEKAR">SEKAR</option>
        </select>
    </div>

    <!-- Sensor Status Indicator -->
    <div id="sensorStatus" class="sensor-status">
        சென்சார் நிலை: காத்திருக்கிறது...
    </div>

    <!-- Current Status Display -->
    <div class="counter-card">
        <div class="counter-title">செயல்முறை நிலை (Process Phase)</div>
        <div id="statusDisplay" style="font-size: 16px; font-weight: bold; margin-top: 10px;">தரையில்தான் உள்ளார்</div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">வெட்டு நிலை (Cuts)</div>
            <div id="cutStatusValue" class="stat-val">0 / 2</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">ஆன்லைன் நிலை</div>
            <div id="syncStatus" class="stat-val" style="color: #2e7d32;">சேமிக்கப்பட்டது</div>
        </div>
    </div>

    <!-- Total Tree Count Section -->
    <div class="total-trees-box">
        <div class="total-trees-title">வெட்டி முடித்த மொத்த மரங்கள்</div>
        <div id="counterValue" class="total-trees-val">0</div>
    </div>

    <!-- Control Buttons -->
    <div class="btn-container">
        <button class="btn-start" onclick="requestSensorPermission()">சென்சார் இயக்கு</button>
        <button class="btn-reset" onclick="resetCounter()">மீட்டமை</button>
    </div>

    <!-- Log Box -->
    <div id="logBox" class="log-box">
        செய்திகள் இங்கே தோன்றும்...
    </div>
</div>

<script>
    let treeCount = 0;
    // Strict 4-Stage State Machine:
    // 0: தரை நிலை (Ground)
    // 1: 10 விநாடிக்கு மேல் மரம் ஏறுதல் (Climbing >= 10s)
    // 2: உச்சியில் 1 அல்லது 2 வெட்டு அதிர்வுகள் (Cutting 1-2 vibrations)
    // 3: கீழே இறங்குதல் (Descent complete -> Triggers +1 count)
    let workPhase = 0; 
    let phaseTimer = 0;
    let cutCount = 0;
    let hasPermissionGranted = false;
    
    // Unchanged Apps Script URL for Google Sheets Sync
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0KF9jQyVuJlbsLTAOLqEmMN0fUjsSb90XJ8ShwJ6wgKUYuRAFK26S4Dnf70Pc_HmR/exec";

    const workerSelect = document.getElementById('workerSelect');
    const counterElement = document.getElementById('counterValue');
    const cutStatusElement = document.getElementById('cutStatusValue');
    const statusDisplay = document.getElementById('statusDisplay');
    const sensorStatus = document.getElementById('sensorStatus');
    const syncStatus = document.getElementById('syncStatus');
    const logBox = document.getElementById('logBox');

    function logMessage(msg) {
        const timeStr = new Date().toLocaleTimeString();
        logBox.innerHTML = `[${timeStr}] ${msg}<br>` + logBox.innerHTML;
    }

    workerSelect.addEventListener('change', function() {
        const worker = workerSelect.value;
        const savedData = localStorage.getItem('coconut_count_' + worker);
        treeCount = savedData !== null ? parseInt(savedData) : 0;
        counterElement.textContent = treeCount;
        workPhase = 0;
        phaseTimer = 0;
        cutCount = 0;
        cutStatusElement.textContent = "0 / 2";
        statusDisplay.textContent = "தரையில்தான் உள்ளார்";
        logMessage(`தொழிலாளி தேர்ந்தெடுக்கப்பட்டார்: ${worker}`);
    });

    function saveOnlineAndLocal() {
        const worker = workerSelect.value;
        if (!worker) return;
        
        // Local Storage Save
        localStorage.setItem('coconut_count_' + worker, treeCount);
        
        // Online Cloud Sync to Google Sheets
        syncStatus.textContent = "ஒத்திசைக்கிறது...";
        
        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
                worker: worker, 
                count: treeCount, 
                timestamp: new Date().toLocaleString() 
            })
        }).then(() => {
            syncStatus.textContent = "ஆன்லைனில் சேமிக்கப்பட்டது";
            logMessage(`கூகுள் ஷீட்டில் சேவ் ஆனது: ${worker} - மொத்தம்: ${treeCount} மரங்கள்`);
        }).catch(err => {
            syncStatus.textContent = "பிழை (Offline)";
            logMessage(`ஆன்லைன் சேமிப்பில் பிழை: ${err}`);
        });
    }

    function resetCounter() {
        if (!workerSelect.value) {
            alert('தயவுசெய்து முதலில் தொழிலாளி பெயரைத் தேர்ந்தெடுக்கவும்.');
            return;
        }
        if (confirm('கவுண்டரை மீட்டமைக்க விரும்புகிறீர்களா?')) {
            treeCount = 0;
            workPhase = 0;
            phaseTimer = 0;
            cutCount = 0;
            counterElement.textContent = treeCount;
            cutStatusElement.textContent = "0 / 2";
            statusDisplay.textContent = "தரையில்தான் உள்ளார்";
            saveOnlineAndLocal();
            logMessage('கவுண்டர் மீட்டமைக்கப்பட்டது.');
        }
    }

    window.addEventListener('load', () => {
        logMessage('பக்கம் திறக்கப்பட்டது. சென்சார் இயக்க தயாராக உள்ளது.');
        if (!(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function')) {
            initSensors();
        } else {
            sensorStatus.textContent = "சென்சார் இயக்க 'சென்சார் இயக்கு' பொத்தானை அழுத்தவும்";
        }
    });

    function requestSensorPermission() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        initSensors();
                    } else {
                        alert('சென்சார் அனுமதி மறுக்கப்பட்டது.');
                        sensorStatus.textContent = "சென்சார் அனுமதி மறுக்கப்பட்டது";
                    }
                })
                .catch(console.error);
        } else {
            initSensors();
        }
    }

    function initSensors() {
        hasPermissionGranted = true;
        sensorStatus.textContent = "சென்சார் செயலில் உள்ளது (Active)";
        sensorStatus.classList.add('active');
        logMessage('மோஷன் சென்சார் வெற்றிகரமாக இணைக்கப்பட்டது.');

        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', handleMotion, true);
        } else {
            logMessage('எச்சரிக்கை: உங்கள் சாதனத்தில் DeviceMotion சென்சார் கிடைக்கவில்லை.');
        }
    }

    let lastTime = Date.now();
    let lastCutTime = 0;

    function handleMotion(event) {
        if (!hasPermissionGranted) return;

        const accZ = event.accelerationIncludingGravity.z;
        const rotRate = event.rotationRate ? Math.abs(event.rotationRate.alpha || 0) : 0; 
        const accX = event.acceleration ? Math.abs(event.acceleration.x || 0) : 0;
        
        if (accZ === null || accZ === undefined) return;

        const currentTime = Date.now();
        const dt = (currentTime - lastTime) / 1000.0;
        lastTime = currentTime;

        if (dt > 0.1 || dt <= 0) return;

        const linearAccZ = accZ - 9.81;

        // Stage 0 -> 1: மரம் ஏறுதல் (Climbing with strict 10 seconds timing interval check)
        if (linearAccZ > 2.0 && workPhase === 0) {
            phaseTimer += dt;
            statusDisplay.textContent = `மரத்தில் ஏறுகிறார்... (${Math.round(phaseTimer)}/10 விநாடி)`;
            if (phaseTimer >= 10.0) { // குறைந்தது 10 விநாடிகள் தொடர் ஏறும் அசைவு இருக்க வேண்டும்
                workPhase = 1;
                phaseTimer = 0;
                statusDisplay.textContent = "மரத்தில் ஏறிவிட்டார். உச்சியில் உள்ளார் 🌴";
                logMessage('10 விநாடி மரம் ஏறுதல் காலமுறைப்படி உறுதி செய்யப்பட்டது.');
            }
        } 
        // Stage 1 -> 2: உச்சியில் 1 அல்லது 2 வெட்டு அதிர்வுகள் (Cutting vibration detection)
        else if (workPhase === 1 && (rotRate > 55 || accX > 4.5)) {
            if (currentTime - lastCutTime > 1000) { // வெட்டுகளுக்கு இடையே குறைந்தபட்ச இடைவெளி
                cutCount++;
                lastCutTime = currentTime;
                cutStatusElement.textContent = cutCount + " / 2";
                statusDisplay.textContent = `தேங்காய் வெட்டும் அதிர்வு (${cutCount}/2) 🥥`;
                logMessage(`வெட்டு அதிர்வு கண்டறியப்பட்டது: ${cutCount}`);

                if (cutCount >= 2) { // 2 வெட்டு அதிர்வுகள் முடிந்ததும் இறங்கும் கட்டத்திற்குச் செல்லும்
                    workPhase = 2;
                    phaseTimer = 0;
                    statusDisplay.textContent = "வெட்டி முடித்தார். கீழே இறங்குகிறார் ⬇️";
                    logMessage('வெட்டும் அதிர்வுகள் நிறைவுபெற்றன. இறங்கத் தொடங்குகிறார்.');
                }
            }
        }
        // Stage 2 -> 3 (Complete): கீழே இறங்குவது மற்றும் தரை சேருவது (Descent complete -> Triggers +1 count)
        else if (workPhase === 2 && linearAccZ < -2.0) {
            phaseTimer += dt;
            if (phaseTimer >= 3.0) { // குறைந்தது 3 விநாடிகள் இறங்கும் அசைவு இருக்க வேண்டும்
                workPhase = 0; // Reset for next tree
                phaseTimer = 0;
                cutCount = 0;
                cutStatusElement.textContent = "0 / 2";
                
                treeCount++;
                counterElement.textContent = treeCount;
                statusDisplay.textContent = "தரையில்தான் உள்ளார் (மரம் முடிந்தது)";
                
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                playBeep();
                saveOnlineAndLocal();
                logMessage(`மரம் ஏறி, வெட்டி, இறங்கியது உறுதி! மொத்த மரங்கள்: ${treeCount}`);
            }
        }
    }

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 800;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch (e) {}
    }
</script>

</body>
</html>
